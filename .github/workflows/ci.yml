name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck all scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/dune-prod/*.sh tests/*.sh tests/backup/helper.bash

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          for f in scripts/*.sh scripts/dune-prod/*.sh tests/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  personal-identifier-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block known personal IPs/hostnames
        run: bash tests/no-personal-identifiers.sh

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken relative links in docs
        run: |
          shopt -s lastpipe
          set +m
          fail=0
          for f in docs/*.md README.md; do
            [ -f "$f" ] || continue
            grep -oE '\]\((scripts|docs)/[^)]+\)' "$f" | sed -E 's/\]\(//; s/\)$//' | while read -r ref; do
              if [ ! -f "$ref" ]; then
                echo "BROKEN LINK in $f: $ref"
                fail=1
              fi
            done
          done
          exit "$fail"

  backup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bats age jq zstd
      - name: Run the backup tests (unprivileged)
        run: bats tests/backup
      - name: Run the sandbox-wrapper tests as root and fail if any is skipped
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" TMPDIR="$RUNNER_TEMP" bash scripts/run-backup-tests.sh tests/backup/helper.bats | tee "$RUNNER_TEMP/wrapper.out"
          if grep -q '# skip' "$RUNNER_TEMP/wrapper.out"; then
            echo "The sandbox-wrapper test was skipped; it must run in CI." >&2
            exit 1
          fi

  ci-gate:
    if: ${{ always() }}
    needs:
      - shellcheck
      - bash-syntax
      - gitleaks
      - personal-identifier-guard
      - markdown-lint
      - backup-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          SHELLCHECK: ${{ needs.shellcheck.result }}
          BASH_SYNTAX: ${{ needs.bash-syntax.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          PERSONAL_GUARD: ${{ needs.personal-identifier-guard.result }}
          MARKDOWN_LINT: ${{ needs.markdown-lint.result }}
          BACKUP_TESTS: ${{ needs.backup-tests.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$SHELLCHECK" "$BASH_SYNTAX" "$GITLEAKS" "$PERSONAL_GUARD" "$MARKDOWN_LINT" "$BACKUP_TESTS"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required checks did not pass."
            exit 1
          fi
          echo "All required checks passed."
