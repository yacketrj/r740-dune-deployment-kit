# Accept ONLY Prometheus remote-write POSTs from the R740 host (meta#99).
server {
    listen 9091;
    allow 192.0.2.10;  # REPLACE with the Proxmox host management IP
    deny all;
    client_max_body_size 16m;
    location = /api/v1/write {
        limit_except POST { deny all; }
        proxy_pass http://dune-prometheus:9090;
    }
    location / { return 403; }
}
