# Overrides for the managed docker-compose.metrics.yml (meta#99). Use with metrics-up.sh.
services:
  dune-prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - /home/dune/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/dune/observability/prometheus/rules-extra:/etc/prometheus/rules-extra:ro
