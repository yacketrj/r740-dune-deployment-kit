# Alertmanager for the Dune stack (meta#99). One receiver: a Discord channel webhook,
# read from a mode-600 file (never written in this config).
route:
  receiver: discord
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: discord
      repeat_interval: 1h

inhibit_rules:
  # A not-READY server already explains its partitions.
  - source_matchers: [alertname="DuneServerNotReady"]
    target_matchers: [alertname="DunePartitionDown"]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord-webhook
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}**{{ .Annotations.summary }}**{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
